services:
  ntfy:
    image: binwiederhier/ntfy:v2.37.2
    container_name: ntfy
    restart: unless-stopped
    command: serve
    ports:
      # Tailscale Serve terminates TLS and proxies to this loopback port.
      - 127.0.0.1:2586:80
    environment:
      TZ: Asia/Ho_Chi_Minh
      # Provisioned from config, not the CLI. Values live in .env (not committed).
      NTFY_BASE_URL: ${NTFY_BASE_URL:?set in .env}
      NTFY_AUTH_USERS: ${NTFY_AUTH_USERS:?set in .env}
      NTFY_AUTH_TOKENS: ${NTFY_AUTH_TOKENS:-}
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - ntfy-cache:/var/cache/ntfy
      - ntfy-auth:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ntfy-cache:
  ntfy-auth:
