version: "3.8"

services:
  meilisearch:
    image: getmeili/meilisearch:v1.10.0
    container_name: meilisearch
    ports:
      - "7700:7700"
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=masterKey
    volumes:
      - meilisearch_data:/meili_data
    command: --master-key masterKey
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - meilisearch-network

volumes:
  meilisearch_data:
    driver: local

networks:
  meilisearch-network:
    driver: bridge
